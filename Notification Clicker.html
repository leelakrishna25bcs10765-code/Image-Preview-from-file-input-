<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Notification Clicker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #f2f2f2;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #4a90e2;
      color: white;
    }
    button:hover {
      background: #357acb;
    }
  </style>
</head>
<body>
  <button id="enable">Enable Notifications</button>
  <button id="send">Send Notification</button>

  <script>
    const enableBtn = document.getElementById('enable');
    const sendBtn = document.getElementById('send');

    enableBtn.onclick = () => {
      Notification.requestPermission();
    };

    sendBtn.onclick = () => {
      if (Notification.permission === "granted") {
        new Notification("👋 Hey there!");
      }
    };
  </script>
</body>
</html>
